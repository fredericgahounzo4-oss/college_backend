<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Le Tchep Consulting Services</title>
    <style>
        /* CSS COMPLET */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 { font-size: 2.5em; margin-bottom: 10px; }

        .form-container { padding: 40px; }

        /* Barre de progression */
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 20px; left: 0; right: 0;
            height: 2px; background: #e0e0e0;
            z-index: 0;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .step-circle {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; color: white;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .step.active .step-circle { background: #667eea; transform: scale(1.1); }
        .step.completed .step-circle { background: #4CAF50; }

        /* Sections du formulaire */
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-next, .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-prev { background: #f0f0f0; color: #333; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎓 Inscription</h1>
        <p>Le Tchep Consulting Services</p>
    </div>

    <div class="form-container">
        <div id="progress-container" class="progress-bar">
            <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <div class="step-label">Personnel</div>
            </div>
            <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <div class="step-label">Formation</div>
            </div>
            <div class="step" data-step="3">
                <div class="step-circle">3</div>
                <div class="step-label">Finalisation</div>
            </div>
        </div>

        <form id="inscriptionForm" action="/forms/inscription/" method="POST">
            <!-- Champs FormSubmit obligatoires -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://Tchepconsultingservices.com/index.html">

            <!-- SECTION 1 -->
            <div class="form-section active" data-section="1">
                <div class="form-row">
                    <div class="form-group">
                        <label>Prénom *</label>
                        <input type="text" name="prenom" required>
                    </div>
                    <div class="form-group">
                        <label>Nom *</label>
                        <input type="text" name="nom" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone *</label>
                        <input type="tel" name="telephone" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date de Naissance *</label>
                        <input type="date" name="date_naissance" required>
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <input type="text" name="adresse">
                    </div>
                </div>
                <div class="form-group">
                    <label>Niveau d'Études</label>
                    <select name="niveau_etudes">
                        <option value="primaire">Primaire</option>
                        <option value="college">Collège</option>
                        <option value="lycee">Lycée</option>
                        <option value="Bac">Baccalauréat</option>
                        <option value="Licence">Licence</option>
                        <option value="Master">Master</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-next" onclick="nextSection(1)">Suivant →</button>
                </div>
            </div>

            <!-- SECTION 2 -->
            <div class="form-section" data-section="2">
                <div class="form-group">
                    <label>Domaine de Formation *</label>
                    <select id="categorie" name="categorie" onchange="updatePrograms()" required>
                        <option value="">Sélectionnez un domaine</option>
                        <option value="gestion">gestion, Comptabilité & Finance</option>
                        <option value="informatique">informatique & Technologies</option>
                        <option value="sante">Santé & Paramédical</option>
                        <option value="logistique">Transit & Logistique</option>
                        <option value="secretariat">Langues & Secrétariat</option>
                        <option value="beaute">Beauté & Esthétique</option>
                        <option value="hotellerie">Hôtellerie & Restauration</option>
                        <option value="technique">technique</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Programme Spécifique *</label>
                    <select id="programme" name="programme" required>
                        <option value="">Choisissez d'abord un domaine</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Session</label>
                        <select name="session">
                            <option value="janvier-2026">Janvier 2026</option>
                            <option value="fevrier-2026">Février 2026</option>
                            <option value="mars-2026">Mars 2026</option>
                            <option value="avril-2026">Avril 2026</option>
                            <option value="mai-2026">Mai 2026</option>
                            <option value="juin-2026">Juin 2026</option>
                            <option value="septembre-2026">Septembre 2026</option>
                            <option value="octobre-2026">Octobre 2026</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Type de Formation</label>
                        <select name="type_formation">
                            <option value="Présentiel">Présentiel</option>
                            <option value="Ligne">En ligne</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-prev" onclick="prevSection(2)">Précédent</button>
                    <button type="button" class="btn-next" onclick="nextSection(2)">Suivant →</button>
                </div>
            </div>

            <!-- SECTION 3 -->
            <div class="form-section" data-section="3">
                <div class="form-group">
                    <label>Situation Professionnelle</label>
                    <select name="situation">
                        <option value="Etudiant">Étudiant(e)</option>
                        <option value="Emploi">Recherche de stage</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comment nous avez-vous connu ?</label>
                    <input type="text" name="source">
                </div>
                <div class="form-group">
                    <label>Objectifs de Formation</label>
                    <textarea name="objectifs" rows="4"></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-prev" onclick="prevSection(3)">Précédent</button>
                    <button type="submit" class="btn-submit">✓ Confirmer l'inscription</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
   // Données des programmes complétées selon le document
    const programsData = {
        gestion: [
            'Comptabilité (Pratique, Audit, Finance)',
            'Auxiliaire des Banques et Microfinances',
            'Comptabilité et Fiscalité des Entreprises',
            'G.R.H (Gestion des Ressources Humaines)',
            'Montage des Dossiers d\'Appel d\'Offres',
            'Comptabilité Pratique des ONG',
            'Gestion de Stock et d\'Approvisionnement',
            'Billetin et Gestion d\'Agence de Voyage'
        ],
        informatique: [
            'Initiation à l\'Informatique',
            'Développement Web et Mobile',
            'Infographie & Sérigraphie',
            'Marketing Digital / Communication',
            'Maintenance Informatique & Réseau',
            'Montage Vidéo & Shooting Photo',
            'Journalisme & Création de Contenu',
            'Programmation & Cybersécurité',
            'Intelligence Artificielle & Big Data',
            'Logiciel d\'Architecture'
        ],
        sante: [
            'Auxiliaire de Pharmacie',
            'Secrétariat Médical',
            'Assistant de Direction Médicale',
            'Délégué Médical',
            'Aide-Soignant (BEP)',
            'Gestion Hospitalière / Pharmaceutique',
            'Assistant de Laboratoire',
            'Soins infirmiers de base et Secourisme'
        ],
        logistique: [
            'Transport Logistique & Transit Douane',
            'Gestion de Projet',
            'Géotechnique / Topographie',
            'Génie Civil'
        ],
        secretariat: [
            'Secrétariat (Bureautique, Juridique, Commercial)',
            'Secrétariat (Caisse, Comptable)',
            'Assistant Bilingue',
            'Allemand (A1, A2, B1, B2)',
            'Anglais (3 ou 6 mois)',
            'Espagnol / Chinois / Français'
        ],
        beaute: [
            'Esthétique de Beauté',
            'Coiffure & Tresse',
            'Stylisme & Haute Couture'
        ],
        hotellerie: [
            'Cuisine & Pâtisserie',
            'Hôtellerie / Restauration / Tourisme',
            'Décoration Événementielle',
            'Hôtesse d\'Accueil'
        ],
        technique: [
            'Énergie Solaire Photovoltaïque',
            'Électricité Bâtiment / Industrielle',
            'Froid & Climatisation',
            'Mécanique Générale & Automobile',
            'Plomberie & Installation Sanitaire',
            'Agroalimentaire / Agropastoral'
        ]
    };

    function updatePrograms() {
        const cat = document.getElementById('categorie').value;
        const progSelect = document.getElementById('programme');
        progSelect.innerHTML = '<option value="">Sélectionnez un programme</option>';
        if (cat && programsData[cat]) {
            programsData[cat].forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.textContent = p;
                progSelect.appendChild(opt);
            });
        }
    }

    function nextSection(current) {
        const sect = document.querySelector(`[data-section="${current}"]`);
        const inputs = sect.querySelectorAll('[required]');
        let valid = true;
        inputs.forEach(i => {
            if (!i.value) { i.style.borderColor = 'red'; valid = false; }
            else { i.style.borderColor = '#e0e0e0'; }
        });
        if (valid) {
            sect.classList.remove('active');
            document.querySelector(`[data-section="${current + 1}"]`).classList.add('active');
            document.querySelector(`[data-step="${current}"]`).classList.replace('active','completed');
            document.querySelector(`[data-step="${current + 1}"]`).classList.add('active');
        }
    }

    function prevSection(current) {
        document.querySelector(`[data-section="${current}"]`).classList.remove('active');
        document.querySelector(`[data-section="${current - 1}"]`).classList.add('active');
        document.querySelector(`[data-step="${current}"]`).classList.remove('active');
        document.querySelector(`[data-step="${current - 1}"]`).classList.replace('completed','active');
    }
</script>


<script>
document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = this;
    var data = new FormData(form);
    var btn = form.querySelector('.btn-submit');
    btn.disabled = true;
    btn.textContent = 'Envoi en cours...';
    fetch(form.action, { method: 'POST', body: data })
        .then(function(r){ return r.json(); })
        .then(function(res){
            if(res.status === 'success'){
                form.style.display = 'none';
                var msg = document.createElement('div');
                msg.style.cssText = 'text-align:center;padding:60px 20px;font-size:1.3rem;color:#28a745;';
                msg.innerHTML = '<h2>✅ Inscription envoyée !</h2><p>Nous vous contacterons très bientôt.</p><p>Redirection vers l\'accueil dans <strong id=\"countdown\">3</strong> secondes...</p>';
                form.parentNode.insertBefore(msg, form);
                var count = 3;
                var timer = setInterval(function(){
                    count--;
                    var el = document.getElementById('countdown');
                    if(el) el.textContent = count;
                    if(count <= 0){ clearInterval(timer); window.location.href = '/'; }
                }, 1000);
            } else {
                btn.disabled = false;
                btn.textContent = '✓ Confirmer l\'inscription';
                alert('Erreur : ' + (res.message || 'Veuillez réessayer.'));
            }
        })
        .catch(function(){
            btn.disabled = false;
            btn.textContent = '✓ Confirmer l\'inscription';
            alert('Erreur réseau. Veuillez réessayer.');
        });
});
</script>

</body>
</html>
