<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body{background:#f4f7f6;font-family:Segoe UI}
form{max-width:400px;margin:100px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
input,button{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{background:#ff8c00;border:none;color:#fff;font-weight:bold;cursor:pointer;border-radius:4px}
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <h2>Connexion Admin</h2>
  <input type="text" name="username" placeholder="Utilisateur" required>
  <input type="password" name="password" placeholder="Mot de passe" required>
  <button type="submit">Connexion</button>
  <p style="color:red">{% if error %}{{ error }}{% endif %}</p>
</form>
</body>
</html>
