<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calendrier Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<style>
body{font-family:'Segoe UI',sans-serif;}
.calendar-section{padding:80px 0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;}
.calendar-card{background:white;border-radius:20px;padding:50px;max-width:900px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.calendar-title{background:#1e3a8a;color:white;padding:20px;border-radius:10px;text-align:center;margin-bottom:40px;font-weight:bold;font-size:1.5rem;}
.calendar-list li{padding:15px 20px;margin-bottom:10px;background:#f8f9fa;border-left:5px solid #667eea;border-radius:8px;display:flex;justify-content:space-between;align-items:center;list-style:none;}
.btn-delete{background:#dc3545;color:white;border:none;padding:5px 15px;border-radius:5px;cursor:pointer;text-decoration:none;}
.btn-add{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:12px 30px;border-radius:8px;width:100%;font-weight:bold;}
</style>
</head>
<body>
<section class="calendar-section">
  <div class="container">
    <div class="calendar-card">
      <div class="calendar-title"><i class="bi bi-calendar-event"></i><br>GESTION DU CALENDRIER</div>

      <form action="{% url 'ajouter_date' %}" method="POST" class="mb-4">
        {% csrf_token %}
        <div class="row mb-2">
          <div class="col-md-6">
            <input type="date" name="date_rentree" class="form-control" required>
          </div>
          <div class="col-md-6">
            <input type="text" name="description" class="form-control" placeholder="Description (optionnel)">
          </div>
        </div>
        <button type="submit" class="btn-add"><i class="bi bi-plus-lg"></i> Ajouter</button>
      </form>

      <ul class="calendar-list ps-0">
        {% for d in dates %}
        <li>
          <div>
            <i class="bi bi-calendar-check me-2"></i>
            <strong>{{ d.date_rentree|date:"d F Y"|upper }}</strong>
            {% if d.description %} - {{ d.description }}{% endif %}
          </div>
          <a href="{% url 'delete_date' d.pk %}" class="btn-delete"
             onclick="return confirm('Supprimer cette date ?')">
            <i class="bi bi-trash"></i> Supprimer
          </a>
        </li>
        {% empty %}
        <li>Aucune date enregistrée.</li>
        {% endfor %}
      </ul>

      <div class="text-center mt-4">
        <a href="{% url 'admin_logout' %}" class="btn btn-secondary">Déconnexion</a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
