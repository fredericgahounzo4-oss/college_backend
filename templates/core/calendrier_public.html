<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calendrier des Rentrées - Tchep Consulting</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<style>
body{font-family:'Segoe UI',sans-serif;margin:0;padding:0;overflow-x:hidden;background:#1e3a8a;}
#snow-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.container{max-width:900px;margin:50px auto;position:relative;z-index:1;}
.card{background:white;border-radius:20px;padding:50px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.card h2{color:#1e3a8a;text-align:center;margin-bottom:40px;font-weight:bold;font-size:2rem;}
.list-group-item{display:flex;justify-content:space-between;align-items:center;padding:20px 25px;margin-bottom:15px;background:#f8f9fa;border-left:5px solid #667eea;border-radius:10px;transition:all 0.3s ease;}
.list-group-item:hover{background:#e9ecef;transform:translateX(5px);}
.description{color:#555;font-size:0.9rem;font-style:italic;}
.back-btn{display:inline-block;margin-top:30px;padding:12px 30px;background:#667eea;color:white;text-decoration:none;border-radius:25px;transition:all 0.3s ease;}
.back-btn:hover{background:#764ba2;transform:translateY(-2px);}
</style>
</head>
<body>
<canvas id="snow-canvas"></canvas>
<div class="container">
  <div class="card">
    <h2><i class="bi bi-calendar-event"></i> Calendrier des Rentrées 2025-2026</h2>
    <ul class="list-group list-group-flush">
      {% for d in dates %}
      <li class="list-group-item">
        <div><i class="bi bi-calendar-check"></i> {{ d.date_rentree|date:"d F Y"|upper }}</div>
        {% if d.description %}<div class="description">{{ d.description }}</div>{% endif %}
      </li>
      {% empty %}
      <li class="list-group-item">Aucune date disponible.</li>
      {% endfor %}
    </ul>
    <div class="text-center">
      <a href="/" class="back-btn"><i class="bi bi-arrow-left"></i> Retour accueil</a>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('snow-canvas');const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;
const flakes=[];for(let i=0;i<100;i++)flakes.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*4+1,d:Math.random()*100});
let angle=0;
function drawSnow(){ctx.clearRect(0,0,w,h);ctx.fillStyle="white";ctx.beginPath();
flakes.forEach(f=>{ctx.moveTo(f.x,f.y);ctx.arc(f.x,f.y,f.r,0,Math.PI*2,true);});ctx.fill();
angle+=0.01;flakes.forEach((f,i)=>{f.y+=Math.cos(angle+f.d)+1+f.r/2;f.x+=Math.sin(angle)*2;
if(f.x>w+5||f.x<-5||f.y>h)flakes[i]={x:Math.random()*w,y:-10,r:f.r,d:f.d};});}
setInterval(drawSnow,33);window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
</script>
</body>
</html>
