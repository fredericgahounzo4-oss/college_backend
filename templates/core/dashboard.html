<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Galerie</title>
<style>
:root{--primary-blue:#0056b3;--secondary-orange:#ff8c00;--danger-red:#dc3545;--light-bg:#f4f7f6;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--light-bg);}
.admin-bar{background:var(--primary-blue);color:var(--white);padding:15px;text-align:center;}
.admin-bar a{background:var(--danger-red);color:var(--white);padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:bold;}
.upload-form{max-width:500px;margin:30px auto;background:var(--white);padding:25px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.1);text-align:center;}
.upload-form h3{margin-bottom:20px;color:var(--primary-blue);}
.upload-form input[type="text"]{width:100%;padding:12px;margin:10px 0;border-radius:6px;border:1px solid #ccc;}
.upload-form input[type="file"]{display:none;}
.custom-file-upload{display:inline-block;padding:12px 20px;background:var(--secondary-orange);color:#fff;font-weight:bold;border-radius:6px;cursor:pointer;margin:10px 0;}
.upload-form button[type="submit"]{width:100%;padding:12px;background:var(--primary-blue);color:#fff;font-weight:bold;border:none;border-radius:6px;cursor:pointer;margin-top:15px;}
.container{max-width:1100px;margin:auto;padding:20px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px;}
.gallery-item{background:var(--white);border-radius:12px;overflow:hidden;position:relative;box-shadow:0 5px 15px rgba(0,0,0,.1);transition:0.3s;}
.gallery-item:hover{transform:translateY(-5px);}
.gallery-item img{width:100%;height:230px;object-fit:cover;display:block;}
.caption{text-align:center;padding:15px;font-weight:bold;color:var(--primary-blue);}
.delete-btn{position:absolute;top:10px;right:10px;background:var(--danger-red);color:var(--white);border-radius:50%;padding:8px 10px;font-size:16px;text-decoration:none;}
</style>
</head>
<body>
<div class="admin-bar">
  <a href="{% url 'admins_logout' %}">Déconnexion</a>
</div>

<form action="{% url 'upload_photo' %}" method="post" enctype="multipart/form-data" class="upload-form">
  {% csrf_token %}
  <h3>Ajouter une photo</h3>
  <input type="text" name="title" placeholder="Titre de la photo" required>
  <label for="image" class="custom-file-upload">Choisir une image</label>
  <input type="file" name="image" id="image" accept="image/*" required>
  <button type="submit">Ajouter</button>
</form>

<div class="container">
  <div class="gallery-grid">
    {% for img in images %}
    <div class="gallery-item">
      <a class="delete-btn" href="{% url 'delete_photo' img.pk %}"
         onclick="return confirm('Supprimer ?')">🗑</a>
      <img src="{{ img.image.url }}" alt="{{ img.title }}">
      <div class="caption">{{ img.title }}</div>
    </div>
    {% empty %}
    <p>Aucune photo.</p>
    {% endfor %}
  </div>
</div>
</body>
</html>
