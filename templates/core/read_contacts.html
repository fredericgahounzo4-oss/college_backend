<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Liste des contacts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h2>Liste des contacts</h2>
<table class="table table-bordered table-striped mt-3">
  <thead class="table-dark">
    <tr><th>Nom</th><th>Email</th><th>Sujet</th><th>Message</th><th>Date</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for c in contacts %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.subject }}</td>
      <td>{{ c.message|truncatechars:60 }}</td>
      <td>{{ c.created_at|date:"d/m/Y H:i" }}</td>
      <td>
        <a href="{% url 'update_contact' c.pk %}" class="btn btn-sm btn-warning">Modifier</a>
        <a href="{% url 'delete_contact' c.pk %}" class="btn btn-sm btn-danger"
           onclick="return confirm('Supprimer ?')">Supprimer</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="6" class="text-center">Aucun contact.</td></tr>
    {% endfor %}
  </tbody>
</table>
</body>
</html>
