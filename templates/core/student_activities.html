<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Galerie TCHEP Consulting</title>
<style>
body{margin:0;font-family:Segoe UI,Arial;background:#f4f7f6}
header{background:#0056b3;color:#fff;padding:30px;text-align:center}
.container{max-width:1100px;margin:auto;padding:20px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
.gallery-item{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.gallery-item img{width:100%;height:230px;object-fit:cover}
.caption{text-align:center;padding:15px;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>TCHEP Consulting Services</h1>
  <p>Galerie professionnelle</p>
</header>
<div class="container">
  <div class="gallery-grid">
    {% for img in images %}
    <div class="gallery-item">
      <img src="{{ img.image.url }}" alt="{{ img.title }}">
      <div class="caption">{{ img.title }}</div>
    </div>
    {% empty %}
    <p>Aucune photo disponible.</p>
    {% endfor %}
  </div>
</div>
</body>
</html>
