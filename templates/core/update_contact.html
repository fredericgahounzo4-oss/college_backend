<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Modifier contact</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h2>Modifier le contact</h2>
<form method="POST" class="mt-3" style="max-width:500px">
  {% csrf_token %}
  <div class="mb-2"><label>Nom</label><input type="text" name="name" value="{{ contact.name }}" class="form-control"></div>
  <div class="mb-2"><label>Email</label><input type="email" name="email" value="{{ contact.email }}" class="form-control"></div>
  <div class="mb-2"><label>Sujet</label><input type="text" name="subject" value="{{ contact.subject }}" class="form-control"></div>
  <div class="mb-2"><label>Message</label><textarea name="message" class="form-control" rows="4">{{ contact.message }}</textarea></div>
  <button type="submit" class="btn btn-primary">Modifier</button>
  <a href="{% url 'read_contacts' %}" class="btn btn-secondary ms-2">Annuler</a>
</form>
</body>
</html>
