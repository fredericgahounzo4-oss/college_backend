<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Modifier inscription</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h2>Modifier l'inscription</h2>
<form method="POST" class="mt-3" style="max-width:600px">
  {% csrf_token %}
  <div class="mb-2"><label>Prénom</label><input type="text" name="prenom" value="{{ insc.prenom }}" class="form-control"></div>
  <div class="mb-2"><label>Nom</label><input type="text" name="nom" value="{{ insc.nom }}" class="form-control"></div>
  <div class="mb-2"><label>Email</label><input type="email" name="email" value="{{ insc.email }}" class="form-control"></div>
  <div class="mb-2"><label>Téléphone</label><input type="text" name="telephone" value="{{ insc.telephone }}" class="form-control"></div>
  <div class="mb-2"><label>Date de naissance</label><input type="date" name="date_naissance" value="{{ insc.date_naissance|date:'Y-m-d' }}" class="form-control"></div>
  <div class="mb-2"><label>Adresse</label><textarea name="adresse" class="form-control">{{ insc.adresse }}</textarea></div>
  <div class="mb-2"><label>Niveau d'études</label><input type="text" name="niveau_etudes" value="{{ insc.niveau_etudes }}" class="form-control"></div>
  <div class="mb-2"><label>Catégorie</label><input type="text" name="categorie" value="{{ insc.categorie }}" class="form-control"></div>
  <div class="mb-2"><label>Programme</label><input type="text" name="programme" value="{{ insc.programme }}" class="form-control"></div>
  <div class="mb-2"><label>Session</label><input type="text" name="session" value="{{ insc.session }}" class="form-control"></div>
  <div class="mb-2"><label>Type de formation</label><input type="text" name="type_formation" value="{{ insc.type_formation }}" class="form-control"></div>
  <div class="mb-2"><label>Source</label><input type="text" name="source" value="{{ insc.source }}" class="form-control"></div>
  <div class="mb-2"><label>Situation</label><input type="text" name="situation" value="{{ insc.situation }}" class="form-control"></div>
  <div class="mb-2"><label>Objectifs</label><textarea name="objectifs" class="form-control">{{ insc.objectifs }}</textarea></div>
  <button type="submit" class="btn btn-primary">Modifier</button>
  <a href="{% url 'read_inscriptions' %}" class="btn btn-secondary ms-2">Annuler</a>
</form>
</body>
</html>
